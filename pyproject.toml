[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ownkit"
version = "0.2.0"
description = "Defensive CLI for leaked secrets, unsafe configs, unpinned deps, git-history patterns, and risky file permissions on paths you own."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Badg3r3u"}]
keywords = ["secrets", "security", "hardening", "defensive", "cli", "dependencies", "permissions", "git"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
ownkit = "ownkit.cli:main"

[project.urls]
Homepage = "https://github.com/Badg3r3u/ownkit"
Repository = "https://github.com/Badg3r3u/ownkit"
Issues = "https://github.com/Badg3r3u/ownkit/issues"
Changelog = "https://github.com/Badg3r3u/ownkit/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
